<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <title>Document</title>
</head>
<body>
    <header>
        <h1>L'Essence</h1>
        <a href="./index.html"><img src="./img/logo.jpeg" alt="Logo"></a>
        <form class="form-buscador" action="./busqueda.html" method="GET">
            <label for="buscador">Buscar producto:</label>
            <input id="buscador" type="text" name="buscador" value="">
            <button type="submit">Buscar</button>
            <p class="error-buscador"></p>
        </form>
        <nav>
            <ul>
                <li> <a href="./index.html">Home</a></li>
                <li class="item-login"> <a href="./login.html">Login</a></li>
                <li class="item-registro"> <a href="./registro.html">Registro</a></li>
                <li class="item-saludo"></li>
            </ul> 
        </nav>
    </header>
    <main>
        <div class="todojunto">
            <nav class="nav-categorias">
                <ul class="lista-categorias">
                </ul>
            </nav>
            <div class="contenido-derecha">
                <section class="detalle-producto">
                    <img  class="foto-detalle" src="" alt="">
                    <div class="detalle-info">
                        <h2 class="nombre-detalle"></h2>
                        <p class="marca"></p>
                        <p class="precio"></p>
                        <p class="descripcion"></p>
                        <p>categoria: <a class="link-categoria" href="">Skin Care</a></p>
                        <p class="stock"></p>
                        <ul class="tags">  
                        </ul>
                    </div>
                </section>
            

                <section class="reviews">
                    <h2>Reviews</h2>
                    <div class="lista-reviews">
                    </div>
                </section>
                  
            </div>
        </div>        
    </main>
    <footer>
        <p>Juana Catelin, Ella Szaszak y Olivia Grljusic</p>
    </footer>
    <script src="./js/detalle.js"></script>
</body>

</html>
