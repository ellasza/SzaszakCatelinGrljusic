<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <title>Document</title>
</head>
<body>
    <header>
        <h1>L'Essence</h1>
        <a href="./index.html"><img src="./img/logo.jpeg" alt="Logo"></a>
        <form class="form-buscador" action="./busqueda.html" method="GET">
            <label for="buscador">Buscar producto:</label>
            <input id="buscador" type="text" name="buscador" value="">
            <button type="submit">Buscar</button>
            <p class="error-buscador"></p>
        </form>
        <nav>
            <ul>
                <li> <a href="./index.html">Home</a></li>
                <li class="item-login"> <a href="./login.html">Login</a></li>
                <li class="item-registro"> <a href="./registro.html">Registro</a></li>
                <li class="item-saludo"></li>
            </ul> 
        </nav>
    </header>
    <main class="centrado">
        <div class="registro-orden">
            <nav class="nav-categorias">
                <ul class="lista-categorias">
                </ul>
            </nav>
            <h2>Registrarme</h2>
            <form class="form1" action="./login.html" method="GET">

                <label for="email">Email</label>
                <input type="email" id="email" name="email" value="">

                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" value="">

                <label for="password2">Repetir contraseña</label>
                <input type="password" id="password2" name="password2" value="">

                <label class="checkbox-label">
                <input type="checkbox" id="terminos" name="terminos" value="acepto" required> Acepto términos y condiciones
                </label>
                <div class="errores"></div>

                <button type="submit">Registrarme</button>
                <a href="./login.html">Ya tengo una cuenta</a>
            </form>
       </div>
    </main>
  
    <footer>
        <p>Juana Catelin, Ella Szaszak y Olivia Grljusic</p>
    </footer>
    <script src="./js/registro.js"></script>
